  <title>The Dystopia of an Imitation by Jaroslaw Solecki in Blue Point Art Gallery</title>
  <meta name="description" content="The Dystopia of an Imitation is a virtual art installation that uses WebGL technology to create an interactive gallery environment.
   The inspiration for the project comes from the paintings of Johannes Vermeer, with a particular focus on The Milkmaid. 
   The booklet 'The Dystopia of an Imitation' is also an important part of the installation. The Dystopia of an imitation is a fascinating exploration of the intersection between art and technology.The project was awarded an Arts Council
    England grant." />

 <div class="button-container" id="button-container">

  <div id="joystick" class="joystick" aria-hidden="true">
    <div class="joystick-base">
      <div class="joystick-stick"></div>
    </div>
  </div>

  <div id="movement-modal" class="modal-overlay" aria-hidden="true" role="dialog" aria-labelledby="movement-title">
    <div class="modal-card" role="document">
      <button class="modal-close" type="button" aria-label="Close movement help">×</button>
      <h2 id="movement-title">How to move</h2>
      <div class="modal-grid">
        <div>
          <h3>Desktop</h3>
          <ul>
            <li>Move: WASD or Arrow keys</li>
            <li>Look/rotate: click + drag</li>
            <li>Zoom: mouse wheel</li>
            <li>Focus artwork: double click</li>
          </ul>
        </div>
        <div>
          <h3>Mobile / Tablet</h3>
          <ul>
            <li>Move: on-screen joystick</li>
            <li>Look/rotate: one-finger drag</li>
            <li>Zoom/pan: two-finger gesture</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <div id="widget" class="flex-container" style="display: none">

    <a href="#" class="close-button" ontouchstart="closeButton()" onclick="closeButton()"></a>
    <script>



      const closeButton = () => {
        document.getElementById('widget').style.display = 'none';
      };
    </script>
   
    <div class="flex-items">
      <iframe src="project_info.html" frameborder="0" allowtransparency="true" title="info"></iframe>
    </div>
  </div>
  </div>
